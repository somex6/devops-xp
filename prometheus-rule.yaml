- job_name: 'dockerswarm'
  dockerswarm_sd_configs:
    - host: unix:///var/run/docker.sock
      role: tasks
  relabel_configs:
    - source_labels: [__meta_dockerswarm_task_desired_state]
      regex: running
      action: keep
    - source_labels: [__meta_dockerswarm_service_label_prometheus_job]
      regex: .+
      action: keep
    - source_labels: [__meta_dockerswarm_service_label_prometheus_job]
      target_label: job
    - source_labels: [__meta_dockerswarm_service_mode]
      regex: global
      action: keep
    - source_labels: [__meta_dockerswarm_task_port_publish_mode]
      regex: host
      action: keep
    - source_labels: [__meta_dockerswarm_node_hostname]
      target_label: docker_node
    - source_labels: [__meta_dockerswarm_service_name]
      target_label: service_name
    - source_labels: [__address__]
      target_label: __address__
      replacement: '${__meta_dockerswarm_node_hostname}:8080' # Assumes cAdvisor on port 8080
  metric_relabel_configs:
    - source_labels: [container_label_com_docker_swarm_service_name]
      target_label: service_name
      action: replace
    - source_labels: [service_name]
      regex: ''
      action: drop
